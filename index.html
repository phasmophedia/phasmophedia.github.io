ca y afectando a la cordura de quienes estén cerca de los objetos lanzados.", "weak": "Cuando no tiene objetos que lanzar, pierde gran parte de su capacidad distintiva. Una habitación despejada limita la observación de su habilidad.", "behavior": "Manipula objetos con frecuencia y puede producir lanzamientos más llamativos que otros fantasmas. Los grupos de objetos pequeños permiten observar mejor sus interacciones.", "identify": "Deja varios objetos juntos en una zona y observa si se produce una ráfaga de lanzamientos. La actividad intensa aislada no es suficiente: busca el patrón y confirma evidencias.", "compare": "Otros fantasmas también lanzan objetos, pero Poltergeist puede hacerlo de forma múltiple y especialmente evidente.", "tips": "Prepara una zona de prueba sin bloquear rutas ni exponerte innecesariamente. Documenta el estado inicial y compara dónde terminan los objetos."}, {"name": "Banshee", "slug": "banshee", "e": ["Ultravioleta", "D.O.T.S.", "Orbes fantasma"], "speed": "1,7 m/s", "hunt": "Su umbral de cacería depende de la cordura de su objetivo; puede ignorar la cordura de otros jugadores para este cálculo.", "ability": "Selecciona un objetivo y tiende a perseguirlo. Puede emitir un grito característico en el micrófono parabólico. Su comportamiento de caza puede parecer extraño si el objetivo está en otra parte del mapa.", "weak": "A veces canta durante eventos, lo que puede facilitar su identificación. El grito especial en el micrófono parabólico es una pista muy valiosa.", "behavior": "Su objetivo es un jugador concreto. Puede seguirlo entre zonas y, en determinadas circunstancias, iniciar una cacería aunque otros jugadores tengan cordura alta.", "identify": "Escucha el micrófono parabólico para detectar el grito especial y observa si los patrones de persecución se centran sistemáticamente en la misma persona.", "compare": "The Twins puede producir actividad en lugares distintos, pero no selecciona un objetivo individual de la misma manera. Phantom petidas. No necesita esperar a que el equipo esté muy debilitado para representar una amenaza.", "identify": "Una cacería a cordura alta puede sugerir Demon, pero otras mecánicas también alteran los umbrales. El periodo de protección del incienso es una prueba complementaria.", "compare": "Mare depende de la oscuridad; Banshee depende de la cordura de su objetivo; Demon destaca por su umbral alto y su habilidad de cacería especial.", "tips": "Prioriza la seguridad desde el inicio. Usa el incienso como herramienta defensiva y registra el tiempo desde la última cacería para evaluar su enfriamiento."}, {"name": "Yurei", "slug": "yurei", "e": ["Orbes fantasma", "Temperaturas bajo cero", "D.O.T.S."], "speed": "1,7 m/s", "hunt": "Umbral estándar: 50%.", "ability": "Puede cerrar completamente una puerta de forma especial y provocar una pérdida de cordura asociada a su habilidad. Su actividad está vinculada a las puertas del entorno.", "weak": "El incienso puede impedir que abandone su habitación durante un periodo, lo que puede ayudar a delimitar su zona.", "behavior": "Puede interactuar con puertas de una manera más contundente que otros fantasmas. Sus acciones pueden afectar a la percepción de cuál es su habitación favorita.", "identify": "Observa cierres completos de puertas y comprueba si se produce la pérdida de cordura asociada. Repite observaciones y confirma las evidencias.", "compare": "Mimic puede imitar comportamientos de otros fantasmas; Yurei tiene una interacción propia con puertas y el efecto del incienso sobre su movimiento.", "tips": "Distingue un cierre normal de puerta de una interacción especial. Mantén la puerta despejada y registra el estado antes y después."}, {"name": "Oni", "slug": "oni", "e": ["EMF nivel 5", "Temperaturas bajo cero", "D.O.T.S."], "speed": "1,7 m/s", "hunt": "Umbral estándar: 50%.", "ability": "Es más activo con jugadores cerca y puede realizar eventos paranormales más visibles. No produce el evento de niebla que algunos fantasmas ntu", "e": ["Ultravioleta", "Orbes fantasma", "Temperaturas bajo cero"], "speed": "Varía con la temperatura: más rápido en frío y más lento en calor.", "hunt": "Umbral estándar: 50%.", "ability": "Su velocidad depende de la temperatura de las habitaciones por las que pasa. Durante una cacería puede emitir aliento visible incluso si no hay temperaturas bajo cero registradas en el termómetro.", "weak": "No puede encender el cuadro eléctrico; mantener la electricidad activa puede calentar la casa y reducir su velocidad, si las condiciones lo permiten.", "behavior": "Se vuelve especialmente rápido en zonas frías. Su desplazamiento puede cambiar al cruzar habitaciones con distintas temperaturas.", "identify": "Observa el aliento durante una cacería y compara la velocidad en zonas frías y cálidas. Revisa también el estado del cuadro eléctrico.", "compare": "Jinn acelera por distancia y electricidad; Hantu acelera por frío. Raiju acelera cerca de equipos electrónicos activos.", "tips": "No confundas la velocidad base con la velocidad modificada por temperatura. La casa necesita tiempo para calentarse o enfriarse."}, {"name": "Goryo", "slug": "goryo", "e": ["EMF nivel 5", "Ultravioleta", "D.O.T.S."], "speed": "1,7 m/s", "hunt": "Umbral estándar: 50%.", "ability": "Su D.O.T.S. solo puede observarse normalmente a través de una cámara de vídeo y cuando los jugadores no están en la misma habitación. No suele cambiar de habitación favorita.", "weak": "Rara vez se aleja de su habitación favorita, por lo que su ubicación puede ser más estable que la de otros fantasmas.", "behavior": "Es reservado y difícil de observar directamente con D.O.T.S. Su patrón de permanencia en una habitación es una pista importante.", "identify": "Coloca el proyector D.O.T.S. y observa desde una cámara mientras todos salen de la habitación. Comprueba si la aparición solo se ve por cámara.", "compare": "D.O.T.S. de otros fantasmas puede observarse directamente; Goryo requiere condiciones de observación más estrictas.", "tips": "Asegúrate de que nadie permanezca en la habitación durante la observación y evita mover constantemente el equipo."}, {"name": "Myling", "slug": "myling", "e": ["EMF nivel 5", "Ultravioleta", "Escritura fantasma"], "speed": "1,7 m/s", "hunt": "Umbral estándar: 50%.", "ability": "Produce sonidos paranormales con mayor frecuencia en el micrófono parabólico. Durante una cacería, sus pasos pueden oírse a menor distancia que los sonidos electrónicos que genera.", "weak": "Es más silencioso durante las cacerías: sus pasos se oyen a una distancia menor.", "behavior": "Puede generar bastantes sonidos detectables con herramientas acústicas, pero durante una persecución el alcance de sus pasos es una pista útil.", "identify": "Durante una cacería, compara el alcance audible de los pasos con el de las interferencias de los dispositivos electrónicos. Hazlo desde un escondite seguro.", "compare": "Raiju puede interferir con electrónica a mayor distancia; Myling se distingue por el alcance reducido de sus pasos durante la cacería.", "tips": "No persigas al fantasma para probar el sonido. Utiliza una ubicación protegida y escucha las diferencias entre pasos e interferencias."}, {"name": "Onryo", "slug": "onryo", "e": ["Spirit Box", "Orbes fantasma", "Temperaturas bajo cero"], "speed": "1,7 m/s", "hunt": "Puede iniciar una cacería cuando se apagan suficientes llamas cercanas; las velas pueden actuar como protección temporal. Su umbral de cordura también importa.", "ability": "Las llamas cercanas influyen en su capacidad de cazar. Puede apagar velas y, tras una secuencia de llamas extinguidas, intentar una cacería.", "weak": "Una llama encendida puede impedir temporalmente que inicie una cacería en determinadas condiciones. Una llama puede actuar como protección frente a su intento de caza.", "behavior": "Las velas son especialmente importantes al investigar un Onryo. Puede apagar llamas y su relación con ellas puede producir un patrón reconocible.", "identify": "Coloca velas de forma segura y observa qué ocurre cuando se extinguen. La interacción con llamas debe evaluarse junto con cordura y evidencias.", "compare": "Mare está ligado a luces eléctricas; Onryo a llamas y velas. No son la misma mecánica.", "tips": "Registra cuántas llamas se apagan y si había jugadores cerca. No dependas de una sola vela ni de una única extinción."}, {"name": "The Twins", "slug": "the-twins", "e": ["EMF nivel 5", "Spirit Box", "Temperaturas bajo cero"], "speed": "Uno puede ser más lento y el otro más rápido que la velocidad normal.", "hunt": "Umbral estándar: 50%.", "ability": "Puede interactuar en dos ubicaciones distintas en un intervalo corto. Una de las entidades inicia la cacería, con una variación de velocidad característica.", "weak": "A menudo interactúa con el entorno casi al mismo tiempo en dos lugares diferentes, lo que puede revelar su naturaleza dual.", "behavior": "La actividad parece proceder de dos zonas separadas. La cacería puede ser más rápida o más lenta que la velocidad habitual según cuál de los dos inicie el ataque.", "identify": "Observa interacciones cercanas en el tiempo en puntos distantes y compara la velocidad de distintas cacerías si hay oportunidad segura.", "compare": "Un fantasma que cambia de habitación puede parecer activo en varios lugares, pero The Twins puede producir interacciones independientes en dos zonas.", "tips": "No interpretes dos sonidos simultáneos como prueba automática. Registra ubicaciones y marcas de tiempo, y confirma las tres evidencias."}, {"name": "Raiju", "slug": "raiju", "e": ["EMF nivel 5", "Orbes fantasma", "D.O.T.S."], "speed": "1,0 m/s cerca de electrónica activa; velocidad normal lejos de ella.", "hunt": "Puede cazar con cordura más alta cerca de dispositivos electrónicos activos; su umbral base es el estándar.", "ability": "Absorbe energía de dispositivos electrónicos activos cercanos para aumentar su velocidad y alterar su umbral de cacería.", "weak": "Interfiere con equipos electrónicos a mayor distancia que otros fantasmas, lo que puede delatar su presencia.", "behavior": "Los aparatos encendidos cerca de su ubicación pueden modificar su comportamiento. El equipamiento apagado o alejado reduce esa ventaja.", "identify": "Compara interferencias y velocidad con aparatos activos y apagados. Asegúrate de que los dispositivos estén realmente dentro del radio de influencia.", "compare": "Jinn se acelera por distancia con el cuadro eléctrico encendido; Raiju se acelera cerca de electrónica activa.", "tips": "Apaga los dispositivos que no uses cuando no estés haciendo una prueba. Separa equipos activos para determinar qué zona afecta a la velocidad."}, {"name": "Obake", "slug": "obake", "e": ["EMF nivel 5", "Ultravioleta", "Orbes fantasma"], "speed": "1,7 m/s", "hunt": "Umbral estándar: 50%.", "ability": "Puede cambiar de forma durante una cacería y tiene una probabilidad especial de dejar huellas ultravioletas con patrones o duración distintos. Puede producir huellas de seis dedos en ciertas superficies.", "weak": "A veces deja huellas ultravioletas especiales o las elimina antes de lo habitual, lo que permite reconocerlo.", "behavior": "Su evidencia ultravioleta puede ser irregular. Las huellas no siempre siguen el patrón esperado y pueden desaparecer con mayor rapidez.", "identify": "Inspecciona cuidadosamente huellas en interruptores, puertas y ventanas. Busca patrones inusuales, como seis dedos, y revisa si una huella desaparece antes de lo esperado.", "compare": "Otros fantasmas con UV pueden dejar huellas normales; Obake puede producir variantes distintivas. The Mimic puede imitar sus rasgos, por lo que hay que revisar orbes falsos.", "tips": "Fotografía o registra las huellas pronto. No descartes Obake solo porque una interacción no deje UV."}, {"name": "The Mimic", "slug": "the-mimic", "e": ["Spirit Box", "Ultravioleta", "Temperaturas bajo cero"], "speed": "Copia la velocidad y rasgos del fantasma que imita; puede variar con el comportamiento copiado.", "hunt": "Depende del fantasma imitado; su cordura y comportamiento pueden cambiar al cambiar de imitación.", "ability": "Imita las características y habilidades de otros tipos de fantasma, cambiando de objetivo de imitación con el tiempo. Además, muestra orbes fantasma como evidencia adicional falsa.", "weak": "Los orbes fantasma adicionales son la pista clave: aparecen junto a sus tres evidencias reales, incluso cuando no son una de ellas.", "behavior": "Puede comportarse de forma distinta en diferentes momentos de la investigación. Una cacería rápida, silenciosa o una habilidad inesperada puede corresponder al fantasma que esté imitando en ese instante.", "identify": "Busca siempre orbes fantasma además de sus tres evidencias. Si aparecen, comprueba Spirit Box, UV y temperaturas bajo cero para confirmar la combinación del Mimic.", "compare": "Puede parecerse a cualquier fantasma, por lo que identificarlo por una sola habilidad es arriesgado. La evidencia adicional de orbes es esencial.", "tips": "No descartes el Mimic porque las otras evidencias parezcan apuntar a otro tipo. Revisa los orbes aunque no formen parte de la combinación habitual."}, {"name": "Moroi", "slug": "moroi", "e": ["Spirit Box", "Escritura fantasma", "Temperaturas bajo cero"], "speed": "Aumenta a medida que baja la cordura media; puede alcanzar velocidades muy altas.", "hunt": "Umbral estándar: 50%, pero su velocidad y presión aumentan con la pérdida de cordura.", "ability": "Puede maldecir a un jugador mediante Spirit Box o micrófono parabólico, haciendo que su cordura disminuya más rápidamente mientras persista el efecto.", "weak": "El incienso lo ciega durante más tiempo durante una cacería que a otros fantasmas.", "behavior": "Se vuelve progresivamente más rápido conforme disminuye la cordura media. La maldición puede acelerar el deterioro de cordura incluso en condiciones de iluminación.", "identify": "Si la cordura cae de forma anormal tras una respuesta de Spirit Box o sonido válido, considera una maldición. Compara su velocidad con la cordura del equipo.", "compare": "Revenant cambia de velocidad al detectar o perder jugadores; Moroi aumenta su velocidad conforme baja la cordura.", "tips": "Usa cordura y velocidad como datos relacionados, no como pruebas aisladas. El incienso puede darte más tiempo para escapar."}, {"name": "Deogen", "slug": "deogen", "e": ["Spirit Box", "Escritura fantasma", "D.O.T.S."], "speed": "Muy rápido lejos de los jugadores y extremadamente lento cuando está cerca.", "hunt": "Umbral estándar: 40%.", "ability": "Conoce la ubicación de los jugadores durante la cacería y se dirige hacia ellos. Al acercarse, reduce muchísimo su velocidad, por lo que esconderse no suele funcionar.", "weak": "Puede responder con una respiración especial en Spirit Box cuando se utiliza muy cerca de él.", "behavior": "Se mueve rápidamente hacia los jugadores y se ralentiza al aproximarse. Su conocimiento de la ubicación hace que los escondites no sean una solución fiable.", "identify": "Prueba Spirit Box a corta distancia para buscar la respuesta respiratoria característica. Durante una cacería, observa el cambio extremo de velocidad desde una ruta segura.", "compare": "Revenant acelera cuando detecta a un jugador; Deogen conoce su ubicación y se ralentiza al llegar cerca. Yokai tiene detección limitada.", "tips": "No te escondas como estrategia principal si sospechas Deogen. Aprende rutas de bucle seguras y mantén espacio para moverte."}, {"name": "Thaye", "slug": "thaye", "e": ["Orbes fantasma", "Escritura fantasma", "D.O.T.S."], "speed": "Comienza muy rápido y se vuelve más lento con la edad.", "hunt": "Puede iniciar cacerías con cordura alta al principio; su umbral y velocidad disminuyen conforme envejece.", "ability": "Envejece cuando los jugadores están cerca. Con el paso del tiempo pierde velocidad, reduce su umbral de cacería y se vuelve menos activo.", "weak": "Se debilita y envejece con la presencia de jugadores, por lo que puede ser mucho menos peligroso al final de la investigación.", "behavior": "Al principio puede ser muy rápido y agresivo. Si los jugadores pasan tiempo cerca de él, sus estadísticas cambian progresivamente.", "identify": "Registra la velocidad y el umbral aparente al principio y compáralos más tarde. Una reducción progresiva de actividad y velocidad puede indicar Thaye.", "compare": "Demon mantiene un perfil de cacerías peligrosas; Thaye se debilita con la edad. Moroi gana velocidad al bajar la cordura, mientras Thaye la pierde con el tiempo.", "tips": "Una observación temprana y otra tardía pueden ser muy reveladoras. No lo juzgues solo por su velocidad al comienzo."}]};
const EVIDENCE=["EMF nivel 5","Spirit Box","Ultravioleta","Orbes fantasma","Escritura fantasma","Temperaturas bajo cero","D.O.T.S."];
let selected=new Set(), currentGhost=null, mode="evidence", query="";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function compatible(g){return [...selected].every(e=>g.e.includes(e))}
function render(){
 if(mode==="evidence") renderEvidence(); else renderGhostIndex();
 if(currentGhost) renderDossier(currentGhost); else renderEmpty();
}
function renderEvidence(){
 $("leftContent").innerHTML=`<div class="eyebrow">INVESTIGATOR'S JOURNAL</div><h1 class="page-title">EVIDENCE</h1><div class="section-label">Select discovered evidence</div><div class="evidence-grid">${EVIDENCE.map(e=>`<button class="ev-btn ${selected.has(e)?"active":""}" data-e="${esc(e)}"><span class="check"></span><span>${esc(e)}</span></button>`).join("")}</div><div class="page-controls"><button id="reset">Reset evidence</button><button id="allEvidence">Clear all</button></div><div class="result-head"><span>Matching entities</span><span class="result-count">${DB.ghosts.filter(compatible).length}</span></div><div class="match-list">${DB.ghosts.filter(compatible).map(g=>`<div class="match" data-g="${g.slug}"><span>${esc(g.name)}</span><small>${g.e.length} EVIDENCES</small></div>`).join("")||'<div class="placeholder">No matching entities.<br>Check your selected evidence.</div>'}</div>`;
 document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{let e=b.dataset.e;selected.has(e)?selected.delete(e):selected.add(e);renderEvidence()});
 document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{currentGhost=b.dataset.g;renderDossier(currentGhost)});
 $("reset").onclick=()=>{selected.clear();renderEvidence()};
 $("allEvidence").onclick=()=>{selected.clear();renderEvidence()};
}
function renderGhostIndex(){
 let list=DB.ghosts.filter(g=>g.name.toLowerCase().includes(query.toLowerCase()));
 $("leftContent").innerHTML=`<div class="eyebrow">CLASSIFIED ENTITY REGISTER</div><h1 class="page-title">GHOST INDEX</h1><div class="section-label">Search the archive</div><input id="ghostSearch" class="searchbox" placeholder="Search ghost..." value="${esc(query)}"><div class="ghost-list">${list.map(g=>`<button class="ghost-item ${currentGhost===g.slug?"selected":""}" data-g="${g.slug}">${esc(g.name)}<small>${g.e.length} EVIDENCE TYPES</small></button>`).join("")||'<div class="placeholder">No entities found.</div>'}</div><div class="footnote">Select an entry to open its field dossier on the facing page.</div>`;
 $("ghostSearch").oninput=e=>{query=e.target.value;renderGhostIndex();let el=$("ghostSearch");el.focus();el.setSelectionRange(query.length,query.length)};
 document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{currentGhost=b.dataset.g;renderGhostIndex();renderDossier(currentGhost)});
}
function renderEmpty(){$("rightContent").innerHTML=`<div class="placeholder"><div class="sigil">✧</div><h2>FIELD DOSSIER</h2><p>Select evidence or choose an entity<br>from the index to open its case file.</p><p style="font-size:11px;letter-spacing:.14em">THE UNKNOWN AWAITS</p></div>`}
function sec(n,t,p){return `<div class="dossier-section"><h3>${n} / ${t}</h3><p>${esc(p)}</p></div>`}
function renderDossier(slug){
 let g=DB.ghosts.find(x=>x.slug===slug);if(!g)return;
 $("rightContent").innerHTML=`<div class="eyebrow">PARANORMAL ENTITY • CASE ${String(DB.ghosts.indexOf(g)+1).padStart(2,"0")}</div><h2>${esc(g.name.toUpperCase())}</h2><span class="stamp">ENTITY DOSSIER</span><div class="section-label" style="text-align:center">Known evidence</div><div class="ev-chips">${g.e.map(e=>`<span class="chip">${esc(e)}</span>`).join("")}</div><div class="stat-grid"><div class="stat"><small>Movement speed</small><span>${esc(g.speed)}</span></div><div class="stat"><small>Hunt threshold / notes</small><span>${esc(g.hunt)}</span></div></div>${sec("01","Special ability",g.ability)}${sec("02","Weakness",g.weak)}${sec("03","Behaviour",g.behavior)}${sec("04","Identification",g.identify)}${sec("05","Distinguishing signs",g.compare)}${sec("06","Investigation notes",g.tips)}<div class="footnote">Reference guide for players. Game mechanics may change between updates; verify version-sensitive values in the current game build.</div>`;
}
$("showEvidence").onclick=()=>{mode="evidence";render();$("showEvidence").style.color="#e6d1a5";$("showGhosts").style.color=""};
$("showGhosts").onclick=()=>{mode="ghosts";render();$("showGhosts").style.color="#e6d1a5";$("showEvidence").style.color=""};
render();
</script></body></html>
